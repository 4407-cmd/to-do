  let reportPeriod = 'daily';

  function renderReport() {
    if (!tabReport.classList.contains('active')) return;
    if (reportPeriod === 'daily') renderDailyReport();
    else renderWeeklyReport();
  }

  // ── Daily Report ──────────────────────────────
  function renderDailyReport() {
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const todayEnd = todayStart + 86400000;
    const todayEntries = entries.filter(e => e.timestamp >= todayStart && e.timestamp < todayEnd);

    const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    const weekdays = ['日','一','二','三','四','五','六'];
    const dateDisplay = `${dateStr} 星期${weekdays[now.getDay()]}`;

    let html = `<div class="report-date">${dateDisplay}</div>`;

    if (todayEntries.length === 0) {
      html += `<div class="report-empty"><div class="icon">🌱</div><p>${WARM_MESSAGES.empty_daily}</p></div>`;
      $('#reportContent').innerHTML = html;
      return;
    }

    // Collect all emotions from today
    const allEmotions = [];
    todayEntries.forEach(entry => {
      const ems = getEntryEmotions(entry);
      ems.forEach(em => allEmotions.push(em));
    });

    // Emotion tags
    html += `<div class="report-section"><h3>💭 今天感受到的情绪</h3><div class="report-emotion-tags">`;
    const tagColors = ['#f59e0b','#10b981','#f97316','#06b6d4','#6366f1','#8b5cf6','#ef4444','#84cc16'];
    allEmotions.forEach((em, i) => {
      const cat = EMOTION_CATEGORIES.find(c => c.label === em.category);
      const color = cat ? cat.color : tagColors[i % tagColors.length];
      html += `<span class="report-emotion-tag" style="background:${color}">${cat?.emoji||''} ${em.specific||em.category}</span>`;
    });
    html += `</div></div>`;

    // Body sensations
    const sensations = [...new Set(todayEntries.map(e => e.bodySensation).filter(Boolean))];
    if (sensations.length > 0) {
      html += `<div class="report-section"><h3>🫀 身体信号</h3><p style="font-size:0.84rem;color:var(--text-secondary);">${sensations.join('、')}</p></div>`;
    }

    // Average intensity
    if (allEmotions.length > 0) {
      const avgInt = Math.round(allEmotions.reduce((s, e) => s + e.intensity, 0) / allEmotions.length);
      html += `<div class="report-section"><h3>📊 平均强度</h3><p style="font-size:1.2rem;font-weight:700;color:var(--primary);">${avgInt}/10</p></div>`;
    }

    // Warm message based on emotion valence
    const hasPositive = allEmotions.some(em => {
      const cat = EMOTION_CATEGORIES.find(c => c.label === em.category);
      return cat && (cat.valence === 'positive');
    });
    const hasNegative = allEmotions.some(em => {
      const cat = EMOTION_CATEGORIES.find(c => c.label === em.category);
      return cat && (cat.valence === 'negative');
    });

    let msg;
    if (hasPositive && !hasNegative) msg = pickRandom(WARM_MESSAGES.positive);
    else if (hasNegative && !hasPositive) msg = pickRandom(WARM_MESSAGES.difficult);
    else msg = pickRandom(WARM_MESSAGES.mixed);

    html += `<div class="report-message warm">${msg}</div>`;
    html += `<p style="text-align:center;font-size:0.78rem;color:var(--text-muted);margin-top:12px;">今天共记录了 <b>${todayEntries.length}</b> 条</p>`;

    $('#reportContent').innerHTML = html;
  }

  // ── Weekly Report ─────────────────────────────
  function renderWeeklyReport() {
    const now = new Date();
    const dayOfWeek = now.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
    monday.setHours(0,0,0,0);
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    sunday.setHours(23,59,59,999);

    const weekEntries = entries.filter(e => e.timestamp >= monday.getTime() && e.timestamp <= sunday.getTime());

    const dateStr = `${monday.getMonth()+1}月${monday.getDate()}日 — ${sunday.getMonth()+1}月${sunday.getDate()}日`;
    let html = `<div class="report-date">📅 ${dateStr}</div>`;

    if (weekEntries.length === 0) {
      html += `<div class="report-empty"><div class="icon">🌿</div><p>${WARM_MESSAGES.empty_weekly}</p></div>`;
      $('#reportContent').innerHTML = html;
      return;
    }

    // Weekly start message
    html += `<div class="report-message">${pickRandom(WARM_MESSAGES.weekly_start)}</div>`;

    // Count stats
    html += `<div class="report-section"><h3>📊 概览</h3>`;
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap;">`;
    html += `<div style="flex:1;min-width:80px;text-align:center;background:#f8fafc;border-radius:10px;padding:14px;"><div style="font-size:1.6rem;font-weight:800;color:var(--primary);">${weekEntries.length}</div><div style="font-size:0.75rem;color:var(--text-muted);">记录次数</div></div>`;

    // Days with records
    const daysWithRecords = new Set(weekEntries.map(e => {
      const d = new Date(e.timestamp);
      return `${d.getMonth()+1}/${d.getDate()}`;
    })).size;
    html += `<div style="flex:1;min-width:80px;text-align:center;background:#f8fafc;border-radius:10px;padding:14px;"><div style="font-size:1.6rem;font-weight:800;color:#10b981;">${daysWithRecords}</div><div style="font-size:0.75rem;color:var(--text-muted);">记录天数</div></div>`;

    // Average intensity
    const allEmotions = [];
    weekEntries.forEach(entry => {
      const ems = getEntryEmotions(entry);
      ems.forEach(em => allEmotions.push(em));
    });
    if (allEmotions.length > 0) {
      const avgInt = (allEmotions.reduce((s, e) => s + e.intensity, 0) / allEmotions.length).toFixed(1);
      html += `<div style="flex:1;min-width:80px;text-align:center;background:#f8fafc;border-radius:10px;padding:14px;"><div style="font-size:1.6rem;font-weight:800;color:#f97316;">${avgInt}</div><div style="font-size:0.75rem;color:var(--text-muted);">平均强度</div></div>`;
    }
    html += `</div></div>`;

    // Emotion frequency chart
    const emotionFreq = {};
    allEmotions.forEach(em => {
      const key = em.specific || em.category;
      emotionFreq[key] = (emotionFreq[key] || 0) + 1;
    });
    const sorted = Object.entries(emotionFreq).sort((a,b) => b[1] - a[1]);
    const maxFreq = sorted[0] ? sorted[0][1] : 1;

    if (sorted.length > 0) {
      html += `<div class="report-section"><h3>🏷️ 情绪频次</h3>`;
      const barColors = ['#6366f1','#8b5cf6','#a78bfa','#f59e0b','#10b981','#ef4444','#06b6d4','#f97316'];
      sorted.forEach(([emotion, count], i) => {
        const pct = Math.round((count / maxFreq) * 100);
        const color = barColors[i % barColors.length];
        html += `<div class="report-chart-row">
          <span style="font-weight:600;min-width:55px;font-size:0.8rem;">${emotion}</span>
          <div class="report-chart-bar-bg"><div class="report-chart-bar" style="width:${pct}%;background:${color};">${count}次</div></div>
        </div>`;
      });
      html += `</div>`;
    }

    // Emotion valence distribution
    const valenceCount = { positive: 0, negative: 0, neutral: 0 };
    allEmotions.forEach(em => {
      const cat = EMOTION_CATEGORIES.find(c => c.label === em.category);
      if (cat && cat.valence) valenceCount[cat.valence] = (valenceCount[cat.valence] || 0) + 1;
    });
    const totalValence = valenceCount.positive + valenceCount.negative + valenceCount.neutral;
    if (totalValence > 0) {
      html += `<div class="report-section"><h3>⚖️ 情绪分布</h3>
        <div style="display:flex;height:24px;border-radius:12px;overflow:hidden;gap:2px;">`;
      if (valenceCount.positive > 0) {
        const pp = Math.round((valenceCount.positive/totalValence)*100);
        html += `<div style="width:${pp}%;background:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#fff;font-weight:700;">😊 ${pp}%</div>`;
      }
      if (valenceCount.neutral > 0) {
        const np = Math.round((valenceCount.neutral/totalValence)*100);
        html += `<div style="width:${np}%;background:#06b6d4;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#fff;font-weight:700;">🤔 ${np}%</div>`;
      }
      if (valenceCount.negative > 0) {
        const bp = Math.round((valenceCount.negative/totalValence)*100);
        html += `<div style="width:${bp}%;background:#8b5cf6;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#fff;font-weight:700;">😢 ${bp}%</div>`;
      }
      html += `</div></div>`;
    }

    // Body sensations
    const allSensations = [...new Set(weekEntries.map(e => e.bodySensation).filter(Boolean))];
    if (allSensations.length > 0) {
      html += `<div class="report-section"><h3>🫀 本周身体信号</h3>
        <p style="font-size:0.84rem;color:var(--text-secondary);">${allSensations.join('、')}</p></div>`;
    }

    // Warm closing messages
    html += `<div class="report-message comfort">${pickRandom(WARM_MESSAGES.weekly_end)}</div>`;
    html += `<div class="report-message warm">${pickRandom(WARM_MESSAGES.weekly_end)}</div>`;

    html += `<p style="text-align:center;font-size:0.78rem;color:var(--text-muted);margin-top:12px;">本周共记录了 <b>${weekEntries.length}</b> 条情绪 · ${daysWithRecords} 天有记录</p>`;

    $('#reportContent').innerHTML = html;
  }

  // ═══════════════════════════════════════════════
  // FRIENDS
  // ═══════════════════════════════════════════════
  async function renderFriends() {
    if (!tabFriends.classList.contains('active')) return;
    const userId = getAnonUserId();
    if (!myNickname) { $('#friendList').innerHTML = '<div class="friend-empty">请先设置昵称</div>'; return; }

    // Load pending requests (to me)
    let requestsHTML = '<h3>📨 好友请求</h3>';
    try {
      const requests = await supabaseGet('/rest/v1/friendships?select=*,from_user_profile:profiles!friendships_from_user_fkey(nickname)&to_user=eq.' + userId + '&status=eq.pending');
      if (requests && requests.length > 0) {
        requests.forEach(r => {
          const fromNick = r.from_user_profile?.nickname || r.from_user;
          requestsHTML += `<div class="friend-item">
            <span class="name">${fromNick}</span>
            <button class="btn-accept" data-from="${r.from_user}">接受</button>
            <button class="btn-reject" data-from="${r.from_user}">拒绝</button>
          </div>`;
        });
      } else {
        requestsHTML += '<div class="friend-empty">暂无好友请求</div>';
      }
    } catch (e) { requestsHTML += '<div class="friend-empty">加载失败</div>'; }
    $('#friendRequests').innerHTML = requestsHTML;

    // Bind accept/reject buttons
    $$('#friendRequests .btn-accept').forEach(btn => {
      btn.addEventListener('click', async () => {
        await supabasePatch('friendships', 'from_user=eq.' + btn.dataset.from + '&to_user=eq.' + userId, { status: 'accepted' });
        renderFriends();
      });
    });
    $$('#friendRequests .btn-reject').forEach(btn => {
      btn.addEventListener('click', async () => {
        // Delete the friendship request
        await fetch(SUPABASE_URL + '/rest/v1/friendships?from_user=eq.' + btn.dataset.from + '&to_user=eq.' + userId, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY },
        });
        renderFriends();
      });
    });

    // Load accepted friends (both directions)
    let friendsHTML = '<h3>👥 我的好友</h3>';
    try {
      const sent = await supabaseGet('/rest/v1/friendships?select=*,to_user_profile:profiles!friendships_to_user_fkey(nickname)&from_user=eq.' + userId + '&status=eq.accepted');
      const received = await supabaseGet('/rest/v1/friendships?select=*,from_user_profile:profiles!friendships_from_user_fkey(nickname)&to_user=eq.' + userId + '&status=eq.accepted');
      const all = [...(sent||[]), ...(received||[])];
      if (all.length > 0) {
        all.forEach(f => {
          const isFromMe = f.from_user === userId;
          const friendId = isFromMe ? f.to_user : f.from_user;
          const friendNick = isFromMe ? (f.to_user_profile?.nickname || friendId) : (f.from_user_profile?.nickname || friendId);
          const remark = f.remark || '';
          friendsHTML += `<div class="friend-item">
            <span class="name">${friendNick}</span>
            ${remark ? `<span class="remark">(${remark})</span>` : ''}
            <button class="btn-remark" data-fid="${f.id}" data-remark="${remark}">✏️备注</button>
          </div>`;
        });
      } else {
        friendsHTML += '<div class="friend-empty">还没有好友，用上方搜索添加吧</div>';
      }
    } catch (e) { friendsHTML += '<div class="friend-empty">加载失败</div>'; }
    $('#friendList').innerHTML = friendsHTML;

    // Bind remark buttons
    $$('#friendList .btn-remark').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newRemark = prompt('输入好友备注：', btn.dataset.remark || '');
        if (newRemark === null) return; // cancelled
        const fid = parseInt(btn.dataset.fid);
        await supabasePatch('friendships', 'id=eq.' + fid, { remark: newRemark });
        renderFriends();
      });
    });
  }

  // Friend search
  $('#btnFriendSearch').addEventListener('click', searchFriends);
  $('#friendSearchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchFriends();
  });

  async function searchFriends() {
    const query = $('#friendSearchInput').value.trim();
    if (!query || !myNickname) return;
    const userId = getAnonUserId();
    const container = $('#friendSearchResult');
    container.innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-muted);">搜索中...</div>';
    try {
      const results = await supabaseGet('/rest/v1/profiles?select=*&nickname=ilike.%25' + encodeURIComponent(query) + '%25&user_id=neq.' + userId + '&limit=10');
      if (!results || results.length === 0) {
        container.innerHTML = '<div class="friend-empty">未找到用户</div>';
        return;
      }
      let html = '<h3 style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:8px;">🔍 搜索结果</h3>';
      results.forEach(r => {
        html += `<div class="search-result-item">
          <span class="name">${r.nickname}</span>
          <button class="btn-add" data-uid="${r.user_id}">加好友</button>
        </div>`;
      });
      container.innerHTML = html;
      // Bind add buttons
      $$('#friendSearchResult .btn-add').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await supabasePost('friendships', { from_user: userId, to_user: btn.dataset.uid, status: 'pending' });
            btn.textContent = '已发送';
            btn.disabled = true;
            btn.style.opacity = '0.5';
          } catch (e) {
            btn.textContent = '失败';
          }
        });
      });
    } catch (e) {
      container.innerHTML = '<div class="friend-empty">搜索失败</div>';
    }
  }

  // ═══════════════════════════════════════════════
  // TAB SWITCHING
  // ═══════════════════════════════════════════════
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Hide all panels
      tabRecord.style.display = 'none';
      tabStats.classList.remove('active');
      tabReport.classList.remove('active');
      tabFriends.classList.remove('active');
      if (tab === 'record') {
        tabRecord.style.display = '';
      } else if (tab === 'stats') {
        tabStats.classList.add('active');
        renderStats();
      } else if (tab === 'friends') {
        tabFriends.classList.add('active');
        renderFriends();
      } else if (tab === 'report') {
        tabReport.classList.add('active');
        renderReport();
      }
    });
  });

  // Report sub-tab toggle (daily/weekly)
  const reportToggleBtns = $$('.report-toggle-btn');
  reportToggleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      reportPeriod = btn.dataset.period;
      reportToggleBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderReport();
    });
  });

  // ═══════════════════════════════════════════════
  // EXPORT
  // ═══════════════════════════════════════════════
  $('#btnExport').addEventListener('click', () => {
    if (entries.length === 0) {
      showToast('还没有记录可以导出');
      return;
    }
    const data = JSON.stringify(entries, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `emotion-records-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 数据已导出');
  });

  // ═══════════════════════════════════════════════
  // RENDER ALL
  // ═══════════════════════════════════════════════
  function renderAll() {
    renderTimeline();
    updateFooterStats();
    if (tabStats.classList.contains('active')) {
      renderStats();
    }
    if (tabReport.classList.contains('active')) {
      renderReport();
    }
  }

  // ═══════════════════════════════════════════════
  // EVENT LISTENERS
  // ═══════════════════════════════════════════════
  // NICKNAME SETUP
  // ═══════════════════════════════════════════════
  let myNickname = localStorage.getItem('emotion-nickname') || '';
  const nicknameOverlay = $('#nicknameOverlay');
  const nicknameInput = $('#nicknameInput');
  const btnNicknameConfirm = $('#btnNicknameConfirm');
  const headerSubtitle = document.querySelector('.header .subtitle');

  function showNicknameModal() {
    nicknameOverlay.classList.remove('hidden');
    nicknameInput.focus();
  }

  function hideNicknameModal() {
    nicknameOverlay.classList.add('hidden');
  }

  async function setupNickname(name) {
    const userId = getAnonUserId();
    name = name.trim();
    if (!name || name.length < 1) return;
    // Always save locally first
    localStorage.setItem('emotion-nickname', name);
    myNickname = name;
    updateHeaderNickname();
    hideNicknameModal();
    // Try cloud save (don't block on failure)
    try { await supabasePost('profiles', { user_id: userId, nickname: name }); } catch(e) {}
  }

  function updateHeaderNickname() {
    if (myNickname && headerSubtitle) {
      headerSubtitle.textContent = '👤 ' + myNickname + ' · 觉察你的内心天气';
    }
  }

  btnNicknameConfirm.addEventListener('click', () => setupNickname(nicknameInput.value));
  nicknameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') setupNickname(nicknameInput.value);
  });

  // ═══════════════════════════════════════════════
  btnStartRecord.addEventListener('click', openModal);

  // ═══════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════
  (async function() {
    try {
      await loadEntries();
      renderAll();
      tabRecord.style.display = '';
      // Check nickname
      if (myNickname) {
        updateHeaderNickname();
      } else {
        // Try loading from Supabase (once, don't block on failure)
        try {
          const userId = getAnonUserId();
          const profiles = await supabaseGet('/rest/v1/profiles?select=nickname&user_id=eq.' + userId);
          if (profiles && profiles.length > 0) {
            myNickname = profiles[0].nickname;
            localStorage.setItem('emotion-nickname', myNickname);
            updateHeaderNickname();
          } else {
            // First visit ever — show nickname modal
            showNicknameModal();
          }
        } catch (e) {
          // Supabase unreachable, skip modal, don't bother user
        }
      }
    } catch (e) {
      document.body.innerHTML = '<div style="padding:40px;text-align:center;color:red;"><h2>加载失败</h2><p>' + e.message + '</p><button onclick="localStorage.clear();location.reload()" style="padding:12px 24px;margin-top:12px;cursor:pointer;">清除数据并刷新</button></div>';
    }
  })();

})();
</script>

</body>
</html>
